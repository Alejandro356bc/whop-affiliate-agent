<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#eef2f7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#eef2f7;padding:34px 12px;">
<tr><td align="center">

<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;background:#ffffff;border-radius:16px;overflow:hidden;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">

  <tr>
    <td style="padding:26px 32px 0 32px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr><td style="background:#e0edff;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#1d4ed8;">Worth a look</td></tr>
      </table>
      <h1 style="margin:18px 0 8px 0;font-size:28px;line-height:1.22;font-weight:700;color:#0f172a;letter-spacing:-.02em;">{{businessName}}</h1>
      <p style="margin:0;font-size:14px;color:#64748b;">{{sellerName}}{{priceLine}}</p>
    </td>
  </tr>

  <tr>
    <td style="padding:24px 32px 0 32px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-radius:12px;overflow:hidden;background:#f1f5f9;">
        <tr><td style="font-size:0;line-height:0;">{{heroImage}}</td></tr>
      </table>
    </td>
  </tr>

  <tr>
    <td style="padding:26px 32px 0 32px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f6f9fc;border-radius:12px;">
        <tr><td style="padding:20px 22px;font-size:17px;line-height:1.6;font-weight:600;color:#1e293b;">{{headline}}</td></tr>
      </table>
    </td>
  </tr>

  <tr>
    <td style="padding:24px 32px 0 32px;">
      <p style="margin:0;font-size:15px;line-height:1.8;color:#475569;">
        You've mentioned wanting something in this space before, so I thought I'd send it across rather than let it disappear into my bookmarks.
      </p>
    </td>
  </tr>

  <tr>
    <td style="padding:28px 32px 34px 32px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr><td align="center" style="background:#1d4ed8;border-radius:10px;">
          <a href="{{referralLink}}" style="display:block;padding:17px 24px;font-size:16px;font-weight:700;color:#ffffff;text-decoration:none;">Join Program</a>
        </td></tr>
      </table>
      <p style="margin:22px 0 0 0;padding-top:20px;border-top:1px solid #e2e8f0;font-size:12px;line-height:1.6;color:#94a3b8;">
        Sent by {{senderName}} because it looked relevant to you.
      </p>
    </td>
  </tr>

</table>

</td></tr>
</table>
</body>
</html>
