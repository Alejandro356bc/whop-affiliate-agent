<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#0b1020;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#0b1020;padding:30px 12px;">
<tr><td align="center">

<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;background:#121a2f;border-radius:16px;overflow:hidden;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">

  <tr>
    <td style="padding:34px 34px 26px 34px;">
      <p style="margin:0;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#7dd3fc;">Premium pick</p>
      <h1 style="margin:16px 0 0 0;font-size:32px;line-height:1.18;font-weight:700;color:#f8fafc;letter-spacing:-.02em;">{{businessName}}</h1>
      <p style="margin:12px 0 0 0;font-size:14px;color:#94a3b8;">{{sellerName}}{{priceLine}}</p>
    </td>
  </tr>

  <tr>
    <td style="padding:0 34px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-radius:12px;overflow:hidden;border:1px solid #223050;">
        <tr><td style="font-size:0;line-height:0;">{{heroImage}}</td></tr>
      </table>
    </td>
  </tr>

  <tr>
    <td style="padding:28px 34px 0 34px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#0d1426;border-left:3px solid #38bdf8;border-radius:0 10px 10px 0;">
        <tr><td style="padding:18px 20px;font-size:17px;line-height:1.6;color:#e2e8f0;">{{headline}}</td></tr>
      </table>
    </td>
  </tr>

  <tr>
    <td style="padding:26px 34px 0 34px;">
      <p style="margin:0;font-size:15px;line-height:1.75;color:#94a3b8;">
        I sort through a lot of these. Most don't survive a second look. This one did, so I'm sending it over while it's still worth sending.
      </p>
    </td>
  </tr>

  <tr>
    <td style="padding:28px 34px 36px 34px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr><td align="center" style="background:#38bdf8;border-radius:9px;">
          <a href="{{referralLink}}" style="display:block;padding:17px 24px;font-size:16px;font-weight:700;color:#0b1020;text-decoration:none;">Join Program</a>
        </td></tr>
      </table>
      <p style="margin:22px 0 0 0;padding-top:20px;border-top:1px solid #223050;font-size:12px;line-height:1.6;color:#64748b;">
        Sent by {{senderName}}.
      </p>
    </td>
  </tr>

</table>

</td></tr>
</table>
</body>
</html>
